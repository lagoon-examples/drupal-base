docker-compose-yaml: docker-compose.yml

project: drupal-base

tasks:
  pre-rollout:
    # - run:
    #     name: drush sql-dump
    #     # Takes a pre-rollout backup of production sites only.
    #     command: mkdir -p /app/web/sites/default/files/private/ && drush sql-dump --ordered-dump --gzip --result-file=/app/web/sites/default/files/private/pre-deploy-dump.sql.gz || true
    #     service: cli
    #     when: LAGOON_ENVIRONMENT_TYPE=="production"

  post-rollout:
    - run:
        name: drush install or update
        # Runs updb then cim. If cim fails (e.g. a fresh environment that was
        # installed with `drush si standard` and has blocking demo content),
        # falls back to `drush si --existing-config` which drops the database
        # and reinstalls cleanly from config/sync.
        # On production environments the fallback is skipped and the task fails
        # loudly so a human can intervene rather than wiping live content.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then
            drush -y updb
            if ! drush -y cim; then
              if [[ "${LAGOON_ENVIRONMENT_TYPE}" == "production" ]]; then
                echo "ERROR: drush cim failed on production — manual intervention required"
                exit 1
              fi
              echo "drush cim failed — reinstalling from config/sync"
              drush -y si --existing-config
            fi
          fi
        service: cli
        shell: bash
    - run:
        name: drush cr
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cr; fi
        service: cli
        shell: bash

environments:
  main:
    cronjobs:
      - name: drush hourly cron
        schedule: "M * * * *"
        command: drush cron
        service: cli
