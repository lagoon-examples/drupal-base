docker-compose-yaml: docker-compose.yml

project: drupal-base

tasks:
  pre-rollout:
    # - run:
    #     name: drush sql-dump
    #     # Takes a pre-rollout backup of production sites only.
    #     command: mkdir -p /app/web/sites/default/files/private/ && drush sql-dump --ordered-dump --gzip --result-file=/app/web/sites/default/files/private/pre-deploy-dump.sql.gz || true
    #     service: cli
    #     when: LAGOON_ENVIRONMENT_TYPE=="production"

  post-rollout:
    - run:
        name: drush install or update
        # If the site UUID in the DB matches config/sync, this is an existing
        # install — run updb then cim as normal.
        # If the UUIDs differ (fresh environment, or site was installed
        # independently), reinstall from config/sync via --existing-config.
        # This avoids the demo content that `drush si standard` creates and
        # which would block cim from deleting config entities.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then
            DB_UUID=$(drush config-get system.site uuid --format=string 2>/dev/null || echo "none")
            CONFIG_UUID=$(grep "^uuid:" /app/config/sync/system.site.yml | awk '{print $2}')
            if [[ "$DB_UUID" == "$CONFIG_UUID" ]]; then
              drush -y updb
              drush -y cim
            else
              drush -y si --existing-config
            fi
          fi
        service: cli
        shell: bash
    - run:
        name: drush cr
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cr; fi
        service: cli
        shell: bash

environments:
  main:
    cronjobs:
      - name: drush hourly cron
        schedule: "M * * * *"
        command: drush cron
        service: cli
