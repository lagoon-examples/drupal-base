docker-compose-yaml: docker-compose.yml

project: drupal-base

tasks:
  pre-rollout:
    # - run:
    #     name: drush sql-dump
    #     # Takes a pre-rollout backup of production sites only.
    #     command: mkdir -p /app/web/sites/default/files/private/ && drush sql-dump --ordered-dump --gzip --result-file=/app/web/sites/default/files/private/pre-deploy-dump.sql.gz || true
    #     service: cli
    #     when: LAGOON_ENVIRONMENT_TYPE=="production"

  post-rollout:
    - run:
        name: drush install or update
        # If Drupal is not bootstrapped (fresh or wiped database), install it
        # with the standard profile before running updates.
        # drush en jsonapi is explicit here because drush cim is commented out
        # and the standard profile does not enable jsonapi by default.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then
            if ! drush status --field=Bootstrap 2>/dev/null | grep -qi "successful"; then
              drush -y si standard
            fi
            drush -y updb
            drush -y en jsonapi
          fi
        service: cli
        shell: bash
    # - run:
    #     name: drush cim
    #     # Enable once the environment DB is clean (no demo content blocking
    #     # config entity deletion). Run manually first:
    #     #   drush entity:delete node --all -y
    #     #   drush entity:delete shortcut --all -y
    #     #   drush cim -y
    #     # After that succeeds, uncomment this task.
    #     command: |
    #       if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cim; fi
    #     service: cli
    #     shell: bash
    - run:
        name: drush cr
        # This will only run if the database exists.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cr; fi
        service: cli
        shell: bash

environments:
  main:
    cronjobs:
      - name: drush hourly cron
        schedule: "M * * * *"
        command: drush cron
        service: cli
