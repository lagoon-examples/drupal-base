docker-compose-yaml: docker-compose.yml

project: drupal-base

tasks:
  pre-rollout:
    # - run:
    #     name: drush sql-dump
    #     # Takes a pre-rollout backup of production sites only.
    #     command: mkdir -p /app/web/sites/default/files/private/ && drush sql-dump --ordered-dump --gzip --result-file=/app/web/sites/default/files/private/pre-deploy-dump.sql.gz || true
    #     service: cli
    #     when: LAGOON_ENVIRONMENT_TYPE=="production"

  post-rollout:
    - run:
        name: drush updb
        # This will only run if the database exists.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y updb; fi
        service: cli
        shell: bash
    - run:
        name: drush config uuid sync
        # Ensures the site UUID matches config/sync/system.site.yml before
        # importing. Required when the site was installed independently
        # (e.g. first Lagoon deploy) and the DB UUID differs from the repo.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then
            CONFIG_UUID=$(grep "^uuid:" /app/config/sync/system.site.yml | awk '{print $2}')
            drush config-set system.site uuid "$CONFIG_UUID" -y
          fi
        service: cli
        shell: bash
    - run:
        name: drush cim
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cim; fi
        service: cli
        shell: bash
    - run:
        name: drush en jsonapi
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y en jsonapi; fi
        service: cli
        shell: bash
    - run:
        name: drush cr
        # This will only run if the database exists.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cr; fi
        service: cli
        shell: bash

environments:
  main:
    cronjobs:
      - name: drush hourly cron
        schedule: "M * * * *"
        command: drush cron
        service: cli
